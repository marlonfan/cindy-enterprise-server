services:
  cindy-enterprise-server:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - cindy-data:/var/lib/cindy
      - ./configs:/etc/cindy:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/cindy-enterprise-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cindy-data:
